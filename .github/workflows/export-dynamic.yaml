name: Export Dynamic Plugin Packages
on:
  workflow_call:
    secrets:
      image-registry-password:
        description: Password to be used to push to container image registry
        required: false
  
    inputs:
      image-registry-user:
        description: User name to be used to push to container image registry
        type: string
        required: false

      node-version:
        description: node-version to execute the export
        type: string
        required: true
      janus-cli-version:
        description: Version of @red-hat-developer-hub/cli (legacy input name).
        type: string
        required: true        

      cli-package:
        description: npm package for plugin export (@red-hat-developer-hub/cli).
        type: string
        required: false
        default: "@red-hat-developer-hub/cli"

      plugins-repo:
        description:
          Name of the repository that contains the backstage plugins to be exported as dynamic. For example
          backstage/backstage.
        type: string
        required: true
      plugins-repo-ref:
        description:
          Git ref (tag, branch or SHA) of the repository that contains the backstage plugins to be exported as dynamic.
          For example backstage/backstage.
        type: string
        required: true
      plugins-repo-backstage-version:
        description: >
          Backstage version recorded for the plugin sources (typically from
          overlay source.json repo-backstage-version). Compared to the source
          workspace backstage.json using same major.minor (patch ignored).
        type: string
        required: false
      plugins-root:
        description:
          Monorepo root relative folder, in the repository that contains the backstage plugins to be exported as
          dynamic.
        required: false
        type: string
        default: "."

      overlay-repo:
        description:
          Name of the repository that contains the list of backstage plugins to be exported as dynamic, as well as
          optional export directives and source overlays.
        required: true
        type: string
      overlay-repo-ref:
        description:
          Git ref (tag, branch or SHA) of the repository that contains the list of backstage plugins to be exported as
          dynamic, as well as optional export directives and source overlays.
        type: string
        required: true
      overlay-root:
        description:
          Relative path of the folder containing the plugins.yaml file, inisde the overlay repository.
        required: false
        type: string
        default: "."
  
      publish-container:
        description: Publish a container image for the dynamic plugins
        type: boolean
        default: false
        required: false

      target-backstage-version:
        description: Target Backstage version for validating OCI tag format in metadata (e.g., "1.42.5")
        type: string
        required: true

      image-repository-prefix:
        description: Repository prefix of the dynamic plugin container images
        type: string
        required: false

      image-tag-prefix:
        description: Optional prefix to prepend to the plugin version in the image tag
        type: string
        required: false

      computed-image-tag-prefix:
        description: >
          The computed image tag prefix reflecting backstage compatibility
          (e.g., "bs_1.48.3__" for compatible, "next__" for incompatible).
          Used by metadata validation to decide whether OCI tag checks apply.
        type: string
        required: false

      publish-release-assets:
        description:
          Whether the dynamic plugin archives should be published as GitHub release assets or pushed as workflow
          artifacts.
        required: false
        type: boolean
        default: ${{ github.ref_type == 'tag' && github.event_name == 'push' }}

      artifact-retention-days:
        description:
          Number of days the dynamic plugin archives will be kept as a workflow artifact (if not published as release
          assets).
        required: false
        type: number
        default: 1

      upload-project-on-error:
        description: Upload the complete project as a workflow artifact in case of error in order to troubleshoot.
        required: false
        type: boolean
        default: false

      last-publish-commit:
        description: Optional commit ID of the last successful publishing of plugin container images
        type: string
        required: false

      force-export:
        description: >
          Export all plugins even when the overlay workspace is unchanged since
          last-publish-commit. Use for smoke tests and manual re-publishes.
        type: boolean
        required: false
        default: false

      skip-metadata-validation:
        description: >
          Skip catalog metadata validation. When false, validation runs in the compile
          job (against post-override-sources trees) and a gate job fails the workflow
          after OCI publish — matching main semantics (images pushed before metadata failure).
        type: boolean
        required: false
        default: false

      export-builder-image:
        description: >
          UBI-based container image for the export compile job. Must match the RHDH runtime ABI
          and Node major from versions.json (e.g. export-builder:ubi9-node24).
          Selected in export-workspaces-as-dynamic prepare from EXPORT_BUILDER_GHCR_IMAGE env.
        type: string
        required: false
        default: ghcr.io/redhat-developer/rhdh-plugin-export-utils/export-builder:ubi9-node24

      cli-caller:
        description: Path to pre-installed rhdh-cli inside the export-builder image
        type: string
        required: false
        default: ""

      export-utils-repository:
        description: Repository for export-utils publish scripts checkout
        type: string
        required: false
        default: redhat-developer/rhdh-plugin-export-utils

      export-utils-ref:
        description: Git ref for export-utils publish scripts checkout
        type: string
        required: false
        default: main
            
    outputs:
      published-exports:
        value: '${{ jobs.export-publish.outputs.published-exports }}'
      failed-exports:
        value: "${{ inputs.publish-container && jobs.export-publish.outputs.failed-exports != '' && jobs.export-publish.outputs.failed-exports || jobs.export-compile.outputs.failed-exports }}"
      metadata-validation-passed:
        description: Whether the metadata validation passed (true/false)
        value: '${{ jobs.export-compile.outputs.metadata-validation-passed }}'
      metadata-validation-errors:
        description: JSON array of metadata validation errors, empty array if validation passed
        value: '${{ jobs.export-compile.outputs.metadata-validation-errors }}'
      metadata-validation-error-count:
        description: Number of metadata validation errors found
        value: '${{ jobs.export-compile.outputs.metadata-validation-error-count }}'
  
jobs:
  export-compile:
    name: Export (compile)

    runs-on: ubuntu-latest

    container:
      image: ${{ inputs.export-builder-image }}

    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      YARN_ENABLE_SCRIPTS: "false"
      NPM_CONFIG_cache: /tmp/npm-cache
      INPUTS_CLI_CALLER: ${{ inputs.cli-caller }}
      # Local composite actions break in container jobs (action_path vs mount). Call scripts directly.
      EXPORT_UTILS_ACTIONS: ${{ github.workspace }}/export-utils-actions

    defaults:
      run:
        working-directory: source-repo/${{ inputs.plugins-root }}

    permissions:
      contents: write

    outputs:
      published-exports: ''
      failed-exports: '${{ steps.export-dynamic.outputs.failed-exports }}'
      staging-artifact-name: '${{ steps.staging-artifact.outputs.name }}'
      staging-uploaded: '${{ steps.upload-staging.outcome == ''success'' }}'
      metadata-validation-passed: >-
        ${{ inputs.skip-metadata-validation && 'skipped'
        || steps.validate-metadata.outputs.metadata-validation-passed }}
      metadata-validation-errors: >-
        ${{ inputs.skip-metadata-validation && '[]'
        || steps.validate-metadata.outputs.metadata-validation-errors }}
      metadata-validation-error-count: >-
        ${{ inputs.skip-metadata-validation && '0'
        || steps.validate-metadata.outputs.metadata-validation-error-count }}
    
    steps:
      - name: Validate Inputs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          INPUT_PLUGINS_ROOT: ${{ inputs.plugins-root }}
          INPUT_OVERLAY_ROOT: ${{ inputs.overlay-root }}
        with:
          script: |
            const pluginsRoot = core.getInput('plugins_root');
            if (pluginsRoot.startsWith('/') || pluginsRoot.includes('..')) {
              core.setFailed(`Invalid plugins root: ${pluginsRoot}`);
            }
            const overlayRoot = core.getInput('overlay_root');
            if (overlayRoot.startsWith('/') || overlayRoot.includes('..')) {
              core.setFailed(`Invalid overlay root: ${overlayRoot}`);
            }

      - name: Checkout plugins repository ${{ inputs.plugins-repo }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ inputs.plugins-root == '.' }}
        with:
          repository: ${{ inputs.plugins-repo }}
          ref: ${{ inputs.plugins-repo-ref }}
          path: source-repo

      - name: Checkout plugins repository ${{ inputs.plugins-repo }} at ${{ inputs.plugins-root }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ inputs.plugins-root != '.' }}
        with:
          repository: ${{ inputs.plugins-repo }}
          ref: ${{ inputs.plugins-repo-ref }}
          sparse-checkout: |
            /*
            !/workspaces/
            ${{ inputs.plugins-root }}
            workspaces/repo-tools/
          sparse-checkout-cone-mode: false
          path: source-repo

      - name: Checkout overlay repository ${{ inputs.overlay-repo }} in the 'overlay-repo' sub-folder
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.overlay-repo }}
          ref: ${{ inputs.overlay-repo-ref }}
          path: overlay-repo
          fetch-depth: 50

      - name: Checkout export-utils composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.export-utils-repository }}
          ref: ${{ inputs.export-utils-ref }}
          sparse-checkout: |
            override-sources
            export-dynamic
            validate-metadata
          sparse-checkout-cone-mode: false
          path: export-utils-actions

      - name: Override Sources
        env:
          OVERLAY_ROOT: ${{ github.workspace }}/overlay-repo/${{inputs.overlay-root}}
          WORKSPACE_ROOT: ${{ github.workspace }}/source-repo/${{ inputs.plugins-root }}
          SOURCE_OVERLAY_FOLDER_NAME: overlay
        run: |
          bash "${EXPORT_UTILS_ACTIONS}/override-sources/override-sources.sh" \
            "${OVERLAY_ROOT}" "${WORKSPACE_ROOT}" "${SOURCE_OVERLAY_FOLDER_NAME}"

      - name: Dump content
        env:
          INPUT_PLUGINS_ROOT: source-repo/${{ inputs.plugins-root }}
        if: ${{ inputs.plugins-root != '.' }}
        run: echo "$INPUT_PLUGINS_ROOT/../.. :" && ls -al ../../ && echo "$INPUT_PLUGINS_ROOT/.. :" && ls -al .. && echo "$INPUT_PLUGINS_ROOT :" && ls -al

      # Same major.minor helper used by discovery/compatibility (RHDHBUGS-3477 / RHDHBUGS-3500).
      # github.job_workflow_sha is the commit of this reusable workflow file.
      - name: Checkout export-utils compatibility helpers
        if: ${{ inputs.plugins-repo-backstage-version != '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: redhat-developer/rhdh-plugin-export-utils
          ref: ${{ github.job_workflow_sha }}
          path: _export-utils
          sparse-checkout: common/scripts/backstage-version-compatible.sh
          sparse-checkout-cone-mode: false

      - name: Check Backstage Version
        env:
          INPUT_REPO_BACKSTAGE_VERSION: ${{ inputs.plugins-repo-backstage-version }}
          INPUT_WORKSPACE_PATH: ${{inputs.overlay-root}}
        if: ${{ inputs.plugins-repo-backstage-version != '' }}
        run: |
          # shellcheck source=common/scripts/backstage-version-compatible.sh
          source "${GITHUB_WORKSPACE}/_export-utils/common/scripts/backstage-version-compatible.sh"

          if [[ ! -f "backstage.json" ]]
          then
            echo "::warning title=No Backstage version for ${INPUT_WORKSPACE_PATH}::The sources of workspace ${INPUT_OVERLAY_ROOT} do not contain the 'backstage.json' file. The 'repo-backstage-version' field of the overlay 'source.json' file (${INPUT_REPO_BACKSTAGE_VERSION}) has been set manually and cannot be verified against sources."
            exit 0
          fi

          sourceBackstageVersion=$(jq -r '.version' backstage.json)
          # Accept same major.minor (patch ignored), matching discovery after RHDHBUGS-3477.
          if ! backstage_versions_minor_match "${sourceBackstageVersion}" "${INPUT_REPO_BACKSTAGE_VERSION}"
          then
            echo "::error title=Inconsistent Backstage version for ${INPUT_WORKSPACE_PATH}::In workspace ${INPUT_OVERLAY_ROOT}, the 'repo-backstage-version' field of the overlay 'source.json' file (${INPUT_REPO_BACKSTAGE_VERSION}) should share the same major.minor as the version mentioned in the workspace 'backstage.json' file (${sourceBackstageVersion}). You should fix this in order to enable robust version compatibility checks."
            exit 1
          fi

      - name: Run yarn install
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          YARN_ENABLE_SCRIPTS: "false"
        run: |
          yarn --version
          yarn install --immutable

      - name: Debug yarn install
        if: failure()
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          YARN_ENABLE_SCRIPTS: "false"
        run: |
          cp yarn.lock yarn.lock.before

          echo "::group::Running mutable yarn install to debug yarn.lock required changes"
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
          echo "::endgroup::"

          echo "::group::Required changes in yarn.lock"
          if command -v diff >/dev/null 2>&1; then
            diff -u yarn.lock.before yarn.lock || true
          else
            echo "diff not installed in export-builder image; yarn.lock differs from immutable install if mutable install changed lockfile"
            cmp -s yarn.lock.before yarn.lock && echo "yarn.lock unchanged" || echo "yarn.lock changed"
          fi
          echo "::endgroup::"

      - name: Run Typescript type checking
        run: yarn tsc

      - name: Export dynamic plugin packages
        if: ${{ success() }}
        id: export-dynamic
        working-directory: source-repo/${{ inputs.plugins-root }}
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
          INPUTS_DESTINATION: ${{ github.workspace }}/dynamic-plugin-archives
          INPUTS_CLI_VERSION: ${{ inputs.janus-cli-version }}
          INPUTS_CLI_PACKAGE: ${{ inputs.cli-package }}
          INPUTS_PLUGINS_FILE: ${{ github.workspace }}/overlay-repo/${{ inputs.overlay-root }}/plugins-list.yaml
          INPUTS_APP_CONFIG_FILE_NAME: app-config.dynamic.yaml
          INPUTS_SCALPRUM_CONFIG_FILE_NAME: scalprum-config.json
          INPUTS_SOURCE_OVERLAY_FOLDER_NAME: overlay
          INPUTS_SOURCE_PATCH_FILE_NAME: patch
          INPUTS_LAST_PUBLISH_COMMIT: ${{ inputs.last-publish-commit }}
          INPUTS_FORCE_EXPORT: ${{ inputs.force-export }}
          INPUTS_CLI_CALLER: ${{ inputs.cli-caller }}
          STAGING_ROOT: ${{ inputs.publish-container && format('{0}/export-staging', github.workspace) || '' }}
          INPUTS_IMAGE_TAG_PREFIX: ${{ inputs.image-tag-prefix }}
          INPUTS_PLUGINS_ROOT: ${{ github.workspace }}/source-repo/${{ inputs.plugins-root }}
        run: |
          bash "${EXPORT_UTILS_ACTIONS}/export-dynamic/export-dynamic.sh" || true
          if [[ -f "${GITHUB_WORKSPACE}/.export-dynamic-outputs" ]]; then
            cat "${GITHUB_WORKSPACE}/.export-dynamic-outputs" >> "${GITHUB_OUTPUT}"
          fi
          if [[ -n "${STAGING_ROOT}" ]]; then
            bash "${EXPORT_UTILS_ACTIONS}/export-dynamic/create-export-staging.sh"
          fi

      - name: Set staging artifact name
        if: ${{ inputs.publish-container }}
        id: staging-artifact
        env:
          INPUT_OVERLAY_ROOT: ${{ inputs.overlay-root }}
        run: |
          name="export-staging-$(echo "${INPUT_OVERLAY_ROOT}" | sed 's:/:-:g')"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload export staging for OCI publish
        id: upload-staging
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: >-
          ${{ inputs.publish-container && success()
          && (inputs.force-export
          || steps.export-dynamic.outputs.workspace-skipped-unchanged-since == 'false') }}
        with:
          name: ${{ steps.staging-artifact.outputs.name }}
          path: ${{ github.workspace }}/export-staging
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Set artifacts name suffix
        id: set-artifacts-name-suffix
        shell: bash
        env:
          INPUT_OVERLAY_ROOT: ${{ inputs.overlay-root }}

        run: |
          ARTIFACTS_NAME_SUFFIX=""
          if [[ "${INPUT_OVERLAY_ROOT}" != "." ]]
          then
            ARTIFACTS_NAME_SUFFIX=" ($(echo ${INPUT_OVERLAY_ROOT} | sed -e 's:/:-:g'))"
          fi
          echo "ARTIFACTS_NAME_SUFFIX=$ARTIFACTS_NAME_SUFFIX" >> $GITHUB_OUTPUT

      - name: Upload exported archives to workflow artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: >-
          ${{ !inputs.publish-release-assets && success()
          && (inputs.force-export
          || steps.export-dynamic.outputs.workspace-skipped-unchanged-since == 'false') }}
        with:
          name: dynamic plugin packages${{ steps.set-artifacts-name-suffix.outputs.ARTIFACTS_NAME_SUFFIX }}
          path: ${{ github.workspace }}/dynamic-plugin-archives
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact-retention-days }}
          overwrite: true

      - name: Upload the project to workflow artifacts on failure
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ inputs.upload-project-on-error && (failure() || steps.export-dynamic.outputs.failed-exports) }}
        with:
          name: project root folder${{ steps.set-artifacts-name-suffix.outputs.ARTIFACTS_NAME_SUFFIX }}
          path: |
            ${{ github.workspace }}
            !${{ github.workspace }}/dynamic-plugin-archives
            !${{ github.workspace }}/node_modules
            !.git
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact-retention-days }}
          overwrite: true
          include-hidden-files: true

      - name: Log that the workspace has been skipped
        if: >-
          ${{ success()
          && steps.export-dynamic.outputs.workspace-skipped-unchanged-since != 'false'
          && steps.export-dynamic.outputs.workspace-skipped-unchanged-since != '' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          INPUT_UNCHANGED_SINCE: ${{ steps.export-dynamic.outputs.workspace-skipped-unchanged-since }}
          INPUT_OVERLAY_REPO: ${{ inputs.overlay-repo }}
          INPUT_OVERLAY_ROOT: ${{ inputs.overlay-root }}
        with:
          script: |
            const unchangedSince = core.getInput('unchanged_since');
            const overlayRepo = core.getInput('overlay_repo');
            const overlayRoot = core.getInput('overlay_root');
            core.notice(
              `Workspace '${overlayRoot}' skipped because it has not been changed since last published commit: ${unchangedSince} (https://github.com/${overlayRepo}/tree/${unchangedSince})`,
              { title: 'Workspace skipped' }
            );
      
      - name: Check export errors
        if: ${{ success() && steps.export-dynamic.outputs.failed-exports != '' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          INPUT_FAILED_EXPORTS: ${{ steps.export-dynamic.outputs.failed-exports }}
          INPUT_PLUGINS_ROOT: ${{ inputs.plugins-root }}
          INPUT_PLUGINS_REPO: ${{ inputs.plugins-repo }}
          INPUT_PLUGINS_REPO_REF: ${{ inputs.plugins-repo-ref }}
          INPUT_OVERLAY_ROOT: ${{ inputs.overlay-root }}
        with:
          script: |
            const overlayRoot = core.getInput('overlay_root');
            const failedExports = core.getMultilineInput('failed_exports');
            const replaceExpr = `- $1 (https://github.com/${ core.getInput('plugins_repo') }/tree/${ core.getInput('plugins_repo_ref') }/${ core.getInput('plugins_root')}/$1)`;
            core.setFailed(`The export for workspace '${overlayRoot}' failed for the following plugins:\n${ failedExports.map(line => line.replace(/^(.*..*)$/gm, replaceExpr)) }`);

      - name: Publish exported plugins as GitHub release assets
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        if: ${{ success() && inputs.publish-release-assets }}
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          body:
            Dynamic Plugins for Red Hat Developer Hub ${{ github.ref_name }}, exported from ${{ inputs.plugins-repo }}.
          files: ${{ github.workspace }}/dynamic-plugin-archives/*
          repository: ${{ github.repository }}

      - name: Validate Catalog Metadata
        if: >-
          ${{ !inputs.skip-metadata-validation
          && (failure() || steps.export-dynamic.outputs.workspace-skipped-unchanged-since == 'false') }}
        id: validate-metadata
        continue-on-error: true
        working-directory: ${{ github.workspace }}/export-utils-actions/validate-metadata
        env:
          INPUTS_OVERLAY_ROOT: ${{ github.workspace }}/overlay-repo/${{inputs.overlay-root}}
          INPUTS_PLUGINS_ROOT: ${{ github.workspace }}/source-repo/${{inputs.plugins-root}}
          INPUTS_TARGET_BACKSTAGE_VERSION: ${{ inputs.target-backstage-version }}
          INPUTS_IMAGE_REPOSITORY_PREFIX: ${{ inputs.image-repository-prefix }}
          INPUTS_COMPUTED_IMAGE_TAG_PREFIX: ${{ inputs.computed-image-tag-prefix }}
        run: |
          npm install
          node validate-metadata.ts

  export-publish:
    name: Publish OCI

    needs: export-compile
    if: >-
      ${{ inputs.publish-container
      && needs.export-compile.result == 'success'
      && needs.export-compile.outputs.staging-uploaded == 'true' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      published-exports: '${{ steps.publish-staging.outputs.published-exports }}'
      failed-exports: '${{ steps.publish-staging.outputs.failed-exports }}'

    steps:
      - name: Download export staging
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.export-compile.outputs.staging-artifact-name }}
          path: export-staging

      - name: Checkout export-utils scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.export-utils-repository }}
          ref: ${{ inputs.export-utils-ref }}
          sparse-checkout: scripts
          path: export-utils

      - name: Publish OCI images from staging
        id: publish-staging
        env:
          EXPORT_BUILDER_IMAGE: ${{ inputs.export-builder-image }}
          STAGING_ROOT: ${{ github.workspace }}/export-staging
          INPUTS_IMAGE_REPOSITORY_PREFIX: ${{ inputs.image-repository-prefix }}
          INPUTS_IMAGE_TAG_PREFIX: ${{ inputs.image-tag-prefix }}
          INPUTS_CLI_CALLER: ${{ inputs.cli-caller }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_REGISTRY_USER: ${{ inputs.image-registry-user != '' && inputs.image-registry-user || github.actor }}
          IMAGE_REGISTRY_PASSWORD: ${{ secrets.image-registry-password }}
        run: |
          # GHA service containers cannot run rootless buildah (no user namespaces).
          # Run the export-builder image privileged on the host Docker daemon instead.
          docker run --rm --privileged \
            --user 0 \
            --entrypoint "" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            -e "STAGING_ROOT=${STAGING_ROOT}" \
            -e "INPUTS_IMAGE_REPOSITORY_PREFIX=${INPUTS_IMAGE_REPOSITORY_PREFIX}" \
            -e "INPUTS_IMAGE_TAG_PREFIX=${INPUTS_IMAGE_TAG_PREFIX}" \
            -e "INPUTS_CLI_CALLER=${INPUTS_CLI_CALLER}" \
            -e "INPUTS_CONTAINER_BUILD_TOOL=buildah" \
            -e "INPUTS_PUSH_CONTAINER_IMAGE=true" \
            -e "GITHUB_ACTOR=${GITHUB_ACTOR}" \
            -e "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}" \
            -e "IMAGE_REGISTRY_USER=${IMAGE_REGISTRY_USER}" \
            -e "IMAGE_REGISTRY_PASSWORD=${IMAGE_REGISTRY_PASSWORD}" \
            -e "BUILDAH_ISOLATION=chroot" \
            -e "STORAGE_DRIVER=vfs" \
            "${EXPORT_BUILDER_IMAGE}" \
            bash "${GITHUB_WORKSPACE}/export-utils/scripts/publish-export-staging.sh"
          if [[ -f "${GITHUB_WORKSPACE}/.publish-export-staging.outputs" ]]; then
            cat "${GITHUB_WORKSPACE}/.publish-export-staging.outputs" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log container image names
        if: ${{ success() && steps.publish-staging.outputs.published-exports != '' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          INPUT_PUBLISHED_EXPORTS: ${{ steps.publish-staging.outputs.published-exports }}
          INPUT_OVERLAY_ROOT: ${{ inputs.overlay-root }}
        with:
          script: |
            const publishedExports = core.getMultilineInput('published_exports');
            const overlayRoot = core.getInput('overlay_root');
            core.summary
              .addHeading(`Published container images for workspace '${overlayRoot}' :`, 4)
              .addList(publishedExports)
              .write();

      - name: Check publish errors
        if: ${{ failure() || steps.publish-staging.outputs.failed-exports != '' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          INPUT_FAILED_EXPORTS: ${{ steps.publish-staging.outputs.failed-exports }}
          INPUT_OVERLAY_ROOT: ${{ inputs.overlay-root }}
        with:
          script: |
            const overlayRoot = core.getInput('overlay_root');
            const failedExports = core.getMultilineInput('failed_exports');
            core.setFailed(`OCI publish for workspace '${overlayRoot}' failed for:\n${failedExports.join('\n')}`);

  export-metadata-gate:
    name: Metadata validation gate

    needs:
      - export-compile
      - export-publish
    if: >-
      ${{ always()
      && !inputs.skip-metadata-validation
      && needs.export-compile.result == 'success'
      && (needs.export-publish.result == 'success'
      || needs.export-publish.result == 'skipped') }}

    runs-on: ubuntu-latest

    steps:
      - name: Fail workflow on metadata validation errors
        if: needs.export-compile.outputs.metadata-validation-passed == 'false'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          INPUT_METADATA_VALIDATION_ERRORS: ${{ needs.export-compile.outputs.metadata-validation-errors }}
          INPUT_METADATA_VALIDATION_ERROR_COUNT: ${{ needs.export-compile.outputs.metadata-validation-error-count }}
          INPUT_OVERLAY_ROOT: ${{ inputs.overlay-root }}
        with:
          script: |
            const overlayRoot = core.getInput('overlay_root');
            const errorCount = core.getInput('metadata_validation_error_count');
            const errorsJson = core.getInput('metadata_validation_errors');
            let detail = `${errorCount} error(s)`;
            try {
              const errors = JSON.parse(errorsJson || '[]');
              if (errors.length > 0) {
                detail = errors.map(e => `${e.file}: ${e.message}`).join('\n');
              }
            } catch {
              detail = errorsJson || detail;
            }
            core.setFailed(
              `Catalog metadata validation failed for workspace '${overlayRoot}' after OCI publish:\n${detail}`,
            );
